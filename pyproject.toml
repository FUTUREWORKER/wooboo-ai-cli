[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wooboo-ai-cli"
version = "0.7.1"
description = "Wooboo AI CLI for user-authorized system media generation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "Future Worker" }
]
keywords = ["wooboo-ai", "wooboo", "cli", "agent", "image-generation", "video-generation", "video-package", "wan3", "digital-human"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Internet :: WWW/HTTP"
]

[project.urls]
Homepage = "https://github.com/FUTUREWORKER/wooboo-ai-cli"
Repository = "https://github.com/FUTUREWORKER/wooboo-ai-cli"

[project.scripts]
wooboo = "wooboo_ai_cli:main"

[tool.setuptools]
py-modules = ["wooboo_ai_cli"]
include-package-data = true
